<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Je staat op de wachtlijst — Promptkoffie</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Je inschrijving voor de Promptkoffie-wachtlijst is gelukt." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-FrZpsOGeqKO1j5CBRejdm.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
    <style>
      :root {
        --purple: #663399;
        --ink: #241a33;
        --cream: #f7f1e3;
        --green: #009b62;
        --body: #4a3f57;
        --muted: #6b5f78;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        background: var(--cream);
        color: var(--ink);
        font-family: 'Space Grotesk', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 32rem;
        background: #fff;
        border: 1.5px solid var(--ink);
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 6px 6px 0 rgba(20, 10, 35, 0.35);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        margin-bottom: 1.75rem;
        text-decoration: none;
        color: inherit;
      }
      .logo img {
        display: block;
        height: 34px;
        width: auto;
      }
      h1 {
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.025em;
        margin: 0 0 0.875rem;
        text-wrap: balance;
      }
      p {
        color: var(--body);
        font-size: 0.9375rem;
        line-height: 1.65;
        margin: 0 0 1rem;
      }
      p.small {
        font-family: 'IBM Plex Mono', monospace;
        color: var(--muted);
        font-size: 0.8125rem;
        margin-bottom: 0;
      }
      .rule {
        border: none;
        border-top: 1.5px solid var(--ink);
        margin: 1.75rem 0 1.25rem;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
        background: var(--purple);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 0.75rem 1.5rem;
        border: 1.5px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .back:hover {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .back:focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="logo" href="/">
        <img src="/promptkoffie-logo.png" alt="Promptkoffie" />
      </a>

      <h1>Je staat op de wachtlijst.</h1>

      <p>
        Je inschrijving is binnen. Je krijgt één mail zodra de bèta opent — verder houden we je
        mailbox met rust.
      </p>

      <hr class="rule" />

      <p class="small">
        In aanbouw. Er is nog geen advertentie verkocht en er is nog niets uitgekeerd. Je hoort het
        als eerste, inclusief wat er misgaat.
      </p>

      <a class="back" href="/">Terug naar de site</a>
    </main>
  </body>
</html>
